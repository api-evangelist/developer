                type: object
                additionalProperties: true
              example:
                meta:
                  total: 566
                  page: 1
                  limit: 2
                  pages: 283
                  query:
                    type: services
                data:
                - name: Microsoft Office
                  slug: microsoft-office
                  companyCount: 731
                  radarRing: Optimizing
                - name: Microsoft Teams
                  slug: microsoft-teams
                  companyCount: 715
                  radarRing: Optimizing
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Window:
              $ref: '#/components/headers/XRateLimitWindow'
            X-RateLimit-Tier:
              $ref: '#/components/headers/XRateLimitTier'
      description: Services, tools and standards ranked by adoption across the profiled company set. Each
        response names the corpus and the matcher it was measured with. Free tier.
  /insights/industries:
    get:
      operationId: listInsightIndustries
      tags:
      - Insights
      summary: Industry rollup. Free.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                meta:
                  total: 50
                  page: 1
                  limit: 2
                  pages: 25
                  query: {}
                data:
                - name: Industrial
                  company_count: 138
                - name: Technology
                  company_count: 135
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Window:
              $ref: '#/components/headers/XRateLimitWindow'
            X-RateLimit-Tier:
              $ref: '#/components/headers/XRateLimitTier'
      description: The same adoption picture rolled up by industry, so a dimension can be read against
        the sector it shows up in. Free tier.
  /insights/companies:
    get:
      operationId: listInsightCompanies
      x-mcp-tool: find_company_insights
      tags:
      - Insights
      summary: Browse profiled companies by name, ranked by readiness. Free.
      parameters:
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                meta:
                  total: 5804
                  page: 1
                  limit: 2
                  pages: 2902
                  query: {}
                data:
                - slug: goldman-sachs
                  name: Goldman Sachs
                  industry: Financial Technology
                  sub_sector: Payment Processing
                  readiness_total: 1756
                - slug: leidos
                  name: Leidos
                  industry: Enterprise Software
                  sub_sector: IT Service Management
                  readiness_total: 1749
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Window:
              $ref: '#/components/headers/XRateLimitWindow'
            X-RateLimit-Tier:
              $ref: '#/components/headers/XRateLimitTier'
      description: Browse the profiled companies by name, ranked by readiness total. The index behind
        the per-company profiles. Free tier.
  /insights/company/{slug}:
    get:
      operationId: getCompanyInsight
      x-mcp-tool: get_company_insight
      tags:
      - Insights
      summary: One company's demand-side profile — thin preview (free) or full 40-dimension profile (Pro).
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                slug: goldman-sachs
                name: Goldman Sachs
                industry: Financial Technology
                sub_sector: Payment Processing
                source: jobs
                confidence: high
                readiness_total: 1756
                top_dimensions:
                - key: data
                  score: 193
                - key: cloud
                  score: 119
                - key: operations
                  score: 112
                sample_gap:
                  dimension: domainSpecialization
                  score: 2
                quarters:
                - q2-2026
                - q1-2026
                upgrade: Preview is deliberately thin. Pro unlocks the full 40-dimension profile, adoption
                  stack, per-quarter history, gaps, and provider matches. https://apis.io/developer/plans/
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Window:
              $ref: '#/components/headers/XRateLimitWindow'
            X-RateLimit-Tier:
              $ref: '#/components/headers/XRateLimitTier'
        '404':
          $ref: '#/components/responses/NotFound'
      description: One company's demand-side profile. The free tier returns a thin preview; Pro returns
        the full 40-dimension profile with the evidence behind each dimension.
  /insights/company/{slug}/gaps:
    get:
      operationId: getCompanyGaps
      x-tier: pro
      x-mcp-tool: company_gaps
      security:
      - ApiKeyAuth: []
      tags:
      - Insights
      summary: PRO — a company's weakest investment dimensions.
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Window:
              $ref: '#/components/headers/XRateLimitWindow'
            X-RateLimit-Tier:
              $ref: '#/components/headers/XRateLimitTier'
        '403':
          description: Requires the Pro tier.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      description: A company's weakest investment dimensions — where the signal is thinnest relative to
        its peers. Pro only.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Optional — raises rate limits above the keyless free tier.
  parameters:
    Q:
      name: q
      in: query
      description: Free-text query over title, summary, tags, and body.
      schema:
        type: string
    Tags:
      name: tags
      in: query
      description: Comma-separated tag slugs.
      schema:
        type: string
    Match:
      name: match
      in: query
      description: Tag match mode.
      schema:
        type: string
        enum:
        - any
        - all
        default: any
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum:
        - default
        - title
        - date
    Fields:
      name: fields
      in: query
      description: Comma-separated sparse field projection.
      schema:
        type: string
        example: slug,title,url
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    Include:
      name: include
      in: query
      description: Set to `content` to inline the full markdown body (up to 200 KB).
      schema:
        type: string
        enum:
        - content
  responses:
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Doc:
      type: object
      description: One network resource. Extra type-specific fields (guest, outline, party, …) appear
        per type.
      properties:
        type:
          type: string
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
        url:
          type: string
          format: uri
        tags:
          type: array
          items:
            type: string
        date:
          type: string
        content:
          type: string
          description: Full markdown body when include=content.
      additionalProperties: true
    Area:
      allOf:
      - $ref: '#/components/schemas/Doc'
      - type: object
        properties:
          related:
            type: array
            items:
              type: object
              properties:
                slug:
                  type: string
                title:
                  type: string
                url:
                  type: string
                  format: uri
                summary:
                  type: string
    PagedEnvelope:
      type: object
      properties:
        meta:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            limit:
              type: integer
            pages:
              type: integer
            query:
              type: object
              additionalProperties: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Doc'
    SearchEnvelope:
      allOf:
      - $ref: '#/components/schemas/PagedEnvelope'
      - type: object
        properties:
          meta:
            type: object
            properties:
              facets:
                type: object
                properties:
                  types:
                    type: object
                    additionalProperties:
                      type: integer
    Engage:
      type: object
      properties:
        email:
          type: string
          format: email
        services_url:
          type: string
          format: uri
        newsletter:
          type: string
          format: uri
    ContactOption:
      type: object
      properties:
        channel:
          type: string
          description: Machine-readable channel key (email, form, newsletter, github, linkedin, bluesky,
            youtube, mail).
        label:
          type: string
        value:
          type: string
          description: The address itself, where the channel is not a URL.
        url:
          type: string
        description:
          type: string
    Error:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
  headers:
    RateLimitPolicy:
      description: 'The rate-limit policy in force for the tier that served this response, in RFC 9331
        quota-policy syntax: `"quota";q=1000;w=86400, "burst";q=5;w=1` — a daily quota and a per-second
        burst. This is the POLICY, not a live counter: `RateLimit-Remaining` and `RateLimit-Reset` are
        deliberately not sent, because the quota is enforced by the gateway and there is no per-key usage
        accounting to read. Pace against the policy, and treat a 429 as authoritative.'
      schema:
        type: string
        examples:
        - '"quota";q=1000;w=86400, "burst";q=5;w=1'
    XRateLimitLimit:
      description: The daily request quota for the tier that served this response.
      schema:
        type: integer
        examples:
        - 1000
    XRateLimitWindow:
      description: The quota window in seconds. Always 86400 (one day).
      schema:
        type: integer
        examples:
        - 86400
    XRateLimitTier:
      description: The tier this request was served on — `free`, `pro`, `business`, `internal` or `owner`.
        Keyless requests are `free`; requests from an apievangelist.com origin are `internal`.
      schema:
        type: string
        examples:
        - free
