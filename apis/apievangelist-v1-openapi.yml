  /papers:
    get:
      operationId: listPapers
      tags:
      - Media
      summary: Papers
      description: API Evangelist white papers — deep dives distilled from sixteen years of research,
        with outlines.
      parameters:
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
