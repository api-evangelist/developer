                - slug: api-drums-are-used-to-communicate
                  title: Drums Are Used to Communicate
                  summary: Long before written language, human communities used drums to send messages
                    across distances too great for the voice to carry, encoding meaning in rhythmic patterns.
                    Talking drums represent one of the earliest examples of transmitting structured information
                    over a shared medium, a precursor to every signaling network that followed.
                  url: https://apievangelist.com/timeline/api/
                  tags: []
                  timeline: api
                  when: Pre-Historic
                  position: 0
                  type: timelines
                - slug: api-pigeons-are-used-to-send-messages
                  title: Pigeons Are Used to Send Messages
                  summary: Ancient civilizations including the Persians, Greeks, and Romans used homing
                    pigeons to carry written messages between distant points, establishing some of the
                    first organized long-distance messaging systems. Pigeon post demonstrated the value
                    of reliable message delivery networks centuries before wires and radio made electronic
                    communication possible.
