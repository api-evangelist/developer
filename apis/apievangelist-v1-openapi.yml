                  has_content: true
                  type: posts
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Window:
              $ref: '#/components/headers/XRateLimitWindow'
            X-RateLimit-Tier:
              $ref: '#/components/headers/XRateLimitTier'
  /posts/{slug}:
    get:
      operationId: getPost
      tags:
      - Stories
      summary: Story
      description: One story by slug (YYYY-MM-DD-slug); `include=content` adds the full markdown body.
      parameters:
      - $ref: '#/components/parameters/Slug'
