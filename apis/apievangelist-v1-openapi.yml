              example:
                meta:
                  total: 46
                  page: 1
                  limit: 2
                  pages: 23
                  query:
                    tags: null
                data:
                - slug: access
                  title: Access
                  summary: 'Gaining the necessary access to effectively use an API is often more challenging
                    than it appears. Intentional and unintentional barriers can create friction in discovering
                    and onboarding with an API. Issues such as incomplete documentation and complex authentication
                    processes frequently hinder adoption. These challenges often reflect the business
                    dynamics and internal politics of making APIs available to teams, partners, and third-party
                    developers.

                    While API access may seem straightforward to the developers who created it—or to those
                    accustomed to high-friction onboarding—it often overlooks critical steps that could
                    simplify the process for others. Improving the API access experience can be as simple
                    as providing clearer instructions, maintaining regular communication, and adopting
                    the perspective of an API consumer. By walking through your own APIs or evaluating
                    competitors’ offerings, you can identify opportunities to streamline access and improve
                    usability.'
                  url: https://experiences.apievangelist.com/store/access/
                  tags:
                  - Availability
                  - Discovery
                  has_content: false
                  type: experiences
                - slug: advocacy
                  title: Advocacy
                  summary: 'Advocacy is the experience of an API having someone in its corner, speaking
                    up for its consumers and carrying their needs back into the operation. Developer relations,
                    evangelism, and outreach are how a provider shows it cares about the people building
                    on its API rather than just shipping endpoints and walking away. Good advocacy turns
                    an API from a product into a relationship.

                    I have spent my whole career on the advocacy side of APIs, so I know how much it matters
                    when someone inside an operation is genuinely fighting for consumers. Advocacy means
                    writing the content, running the outreach, and closing the loop between what developers
                    struggle with and what the team builds next. The APIs that invest in advocacy are
                    the ones that build durable, loyal communities.'
                  url: https://experiences.apievangelist.com/store/advocacy/
                  tags:
                  - Evangelism
                  - Communication
                  - Community
                  has_content: false
                  type: experiences
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Window:
