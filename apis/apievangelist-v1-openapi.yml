servers:
- url: https://api.apievangelist.com/v1
security:
- {}
- ApiKeyAuth: []
tags:
- name: Overview
  description: Service info and unified search across the whole network.
- name: Stories
  description: The API Evangelist blog — 5,000+ posts since 2010.
- name: Areas
  description: The 77 focused topic areas and their related-area graph.
- name: Guidance
  description: Editorial guidance across the history, technology, business, politics, governance, and
    evangelism of APIs.
- name: Governance
  description: The policies and rules that align the business and engineering sides of API operations.
- name: Toolbox
  description: Standards, solutions, tools, schema, and properties — the raw materials of API operations.
- name: Operations
  description: Strategies, experiences, and the stops along the API lifecycle.
- name: Media
  description: Conversations, videos, white papers, and the newsletter.
- name: Reference
  description: The API vocabulary and the static machine-readable feeds.
- name: Timelines
  description: The API, resource, industry, and people timelines behind sixteen years of research.
- name: Services
  description: API Evangelist's first-party offerings — the front door to working with Kin Lane.
- name: Contact
  description: Every way to reach API Evangelist.
- name: Insights
  description: Demand-side intelligence — what ~5,800 companies (Fortune 1000 + API providers) build,
    buy, and hire for around APIs, data, and AI. Discovery is free; per-company depth + gaps are Pro.
    (The supply↔demand provider match lives on apis.io.)
- name: Tags
  description: The tag taxonomy across the whole network — the map of everything API Evangelist covers,
    and the join key behind every /related response.
- name: Synthesis
  description: 'Curated synthesis over the network rather than raw retrieval: guides assembled for a topic,
    and the counts behind the catalog.'
- name: APIs
  description: Individual API resources tracked across the network, and the relevance graph between them.
- name: Papers
  description: White papers and reports, and the relevance graph between them.
- name: Building Blocks
  description: The governance building blocks — guidance, rules, policies, standards, strategies, schema,
    properties, experiences and lifecycle — and the relevance graph between them.
paths:
  /:
    get:
      operationId: getServiceInfo
      tags:
      - Overview
      summary: Info
      description: Counts per resource type, entry points, documentation links, and how to engage.
      responses:
        '200':
          description: Service overview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  version:
                    type: string
                  description:
                    type: string
                  counts:
                    type: object
                    additionalProperties:
                      type: integer
                  resources:
                    type: array
                    items:
                      type: string
                  documentation:
                    type: string
                    format: uri
                  openapi:
                    type: string
                    format: uri
                  mcp:
                    type: string
                    format: uri
                  engage:
                    $ref: '#/components/schemas/Engage'
              example:
                service: API Evangelist
                version: v1
                description: Sixteen years of API research — stories, topic areas, guidance, rules, policies,
                  standards, strategies, and more — as one API. Built to help teams navigate the API landscape
                  and find where API Evangelist can help.
                counts:
                  posts: 5267
                  areas: 77
                  guidance: 180
                  rules: 617
                  policies: 283
                  standards: 613
                  strategies: 75
                  schema: 11
                  properties: 791
                  experiences: 46
                  lifecycle: 29
                  conversations: 59
                  papers: 21
                  reports: 128
                  services: 25
                  solutions: 742
                  tools: 527
                  videos: 103
                  timelines: 565
                  vocabulary: 6988
                resources:
                - /v1/posts
                - /v1/areas
                - /v1/guidance
                - /v1/rules
                - /v1/policies
                - /v1/standards
                - /v1/strategies
                - /v1/schema
                - /v1/properties
                - /v1/experiences
                - /v1/lifecycle
                - /v1/conversations
                - /v1/papers
                - /v1/reports
                - /v1/services
                - /v1/solutions
                - /v1/vocabulary
                - /v1/newsletters
                - /v1/feeds
                - /v1/tools
                - /v1/videos
                - /v1/timelines
                - /v1/tags
                - /v1/contact
                synthesis:
                  guide: /v1/guide?topic= (Pro)
                  stats: /v1/stats (Pro)
                  related: /v1/{type}/{slug}/related
                tiers:
                  free: Browse, search, and read summaries across the whole network + tags + related.
                  pro: Full research content (include=content), curated topic guides (/guide), and catalog
                    intelligence (/stats).
                  plans: https://developer.apievangelist.com/plans/
                search: /v1/search?q=
                documentation: https://developer.apievangelist.com/
                openapi: https://developer.apievangelist.com/apis/apievangelist-v1-openapi.yml
                mcp: https://mcp.apievangelist.com/mcp
                engage:
                  email: info@apievangelist.com
                  services_url: https://apievangelist.com/services/
                  newsletter: https://buttondown.com/apievangelist
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Window:
              $ref: '#/components/headers/XRateLimitWindow'
            X-RateLimit-Tier:
              $ref: '#/components/headers/XRateLimitTier'
  /search:
    get:
      operationId: searchNetwork
      tags:
      - Overview
      summary: Search
      description: 'Search every resource type at once. `meta.facets.types` carries per-type hit counts
        for the full result set (useful for filter chips); narrow with `types=`.

        '
      parameters:
      - $ref: '#/components/parameters/Q'
      - name: types
        in: query
        description: Comma-separated resource types to include (default all).
        schema:
          type: string
          example: posts,guidance,solutions
      - $ref: '#/components/parameters/Tags'
      - $ref: '#/components/parameters/Match'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paged, type-faceted results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchEnvelope'
              examples:
                gateway:
                  summary: Search "gateway" across the network
                  value:
                    meta:
                      total: 1835
                      page: 1
                      limit: 3
                      pages: 612
                      query:
                        q: gateway
                      facets:
                        types:
                          posts: 1076
                          areas: 22
                          guidance: 24
                          standards: 67
                    data:
                    - type: areas
                      slug: gateway
                      title: Gateway
                      summary: A collection of services, tooling, and open source solutions for API gateway
                        management…
                      url: https://gateway.apievangelist.com
                      tags:
                      - API Gateway
                      - Traffic Management
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Window:
              $ref: '#/components/headers/XRateLimitWindow'
            X-RateLimit-Tier:
              $ref: '#/components/headers/XRateLimitTier'
  /posts:
    get:
      operationId: listPosts
      tags:
      - Stories
      summary: Stories
      description: Search or browse 5,000+ API Evangelist stories (2010–present); filter by year or tags.
      parameters:
      - $ref: '#/components/parameters/Q'
      - name: year
        in: query
        description: Filter to one publication year.
        schema:
          type: string
          example: '2026'
      - $ref: '#/components/parameters/Tags'
      - $ref: '#/components/parameters/Match'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paged stories, newest first by default.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEnvelope'
              example:
                meta:
                  total: 5267
                  page: 1
                  limit: 2
                  pages: 2634
                  query:
                    tags: null
                data:
                - slug: 2026-09-29-you-cannot-see-your-own-api-from-the-outside
                  title: You Cannot See Your Own API From The Outside
                  summary: ''
                  url: https://apievangelist.com/2026/09/29/you-cannot-see-your-own-api-from-the-outside/
                  tags:
