          description: Paged policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEnvelope'
              example:
                meta:
                  total: 283
                  page: 1
                  limit: 2
                  pages: 142
                  query:
                    tags: null
                data:
                - slug: openapi-operation-response-2xx-examples
                  title: 2xx Response Examples (OpenAPI)
                  summary: Require that every successful 2xx response in our OpenAPI definitions includes
                    at least one realistic example, so a consumer can see exactly what a good answer looks
                    like without making a live call. I have onboarded to too many APIs where the schema
                    was technically complete but I still could not picture the actual payload, and examples
                    are what close that gap. Good examples power interactive documentation, mock servers,
                    and generated tests, and they set the expectation for what a healthy integration receives.
                    I treat a missing success example as a documentation gap that we fix before the API
                    ships.
                  url: https://policies.apievangelist.com/store/openapi-operation-response-2xx-examples/
                  tags:
                  - Design
                  - Documentation
                  - Consistency
                  - Producers
                  has_content: false
                  type: policies
                - slug: openapi-operation-response-2xx-media-types
                  title: 2xx Response Media Types (OpenAPI)
                  summary: Require that every 2xx response declares the media types it returns, spelling
                    out application/json or whatever content it actually serves rather than leaving the
                    content negotiation a mystery. I have integrated with APIs that promised JSON and
                    quietly returned HTML on a good day, and that kind of surprise breaks parsers and
                    erodes trust immediately. When the successful response media types are explicit in
                    the contract, consumers can set the right Accept headers and deserialize with confidence,
                    and our tooling can validate that we deliver what we promised. Content type is part
                    of the contract, and I want it stated plainly for every success path.
                  url: https://policies.apievangelist.com/store/openapi-operation-response-2xx-media-types/
                  tags:
                  - Design
                  - Documentation
                  - Interoperability
                  - Producers
                  has_content: false
                  type: policies
          headers:
            RateLimit-Policy:
