gaps:
- 429 is not declared on any operation in either spec, although a 5 req/s and 1,000 req/day limit
  is documented in prose — an agent has no contract for the throttled case.
- 5xx is not declared on any operation in either spec.
- No error `type` URI and no application/problem+json, so error classes are not dereferenceable.
- The two APIs behind one base URL use different envelope field names (`detail` vs `message`) and
  different status codes for the same Pro wall (403 vs 402).
