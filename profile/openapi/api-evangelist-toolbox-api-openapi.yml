    get:
      operationId: getStandardsItem
      tags:
      - Toolbox
      summary: Standard
      description: One entry from the standards collection; `include=content` adds the full body.
      parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doc'
              example:
                slug: aiignore
                title: .aiignore
                summary: Configuration file specifying files and directories that AI coding agents should not process or modify, similar to .gitignore but for AI tools. Used by JetBrains Junie and other AI agents.
                url: https://standards.apievangelist.com/store/aiignore/
                tags:
                - AI Agents
