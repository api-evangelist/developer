openapi: 3.2.0
info:
  title: Evangelist Network Toolbox API
  version: 1.2.0
  summary: Sixteen years of API research as one API.
  description: 'The API Evangelist network — 5,000+ stories, 77 topic areas, 2,400+ governance building

    blocks (guidance, rules, policies, standards, strategies, schema, properties, experiences,

    lifecycle), conversations, videos, white papers, tools, timelines, services, and the API

    vocabulary — served as a single, searchable REST API.'
  contact:
    name: API Evangelist
    email: info@apievangelist.com
    url: https://apievangelist.com
  license:
    name: CC BY-SA 4.0
    url: https://creativecommons.org/licenses/by-sa/4.0/
servers:
- url: https://api.apievangelist.com/v1
security:
- {}
- ApiKeyAuth: []
tags:
- name: Toolbox
  description: Standards, solutions, tools, schema, and properties — the raw materials of API operations.
paths:
  /standards:
    get:
      operationId: listStandards
      tags:
      - Toolbox
      summary: Standards
      description: Search or browse the standards collection (432) — the API standards landscape.
      parameters:
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Tags'
      - $ref: '#/components/parameters/Match'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paged standards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEnvelope'
              example:
                meta:
                  total: 613
                  page: 1
                  limit: 2
                  pages: 307
                  query:
                    tags: null
                data:
                - slug: aiignore
                  title: .aiignore
                  summary: Configuration file specifying files and directories that AI coding agents should not process or modify, similar to .gitignore but for AI tools. Used by JetBrains Junie and other AI agents.
                  url: https://standards.apievangelist.com/store/aiignore/
                  tags:
                  - AI Agents
                  - Configuration
                  - Security
                  - Developer Workflow
                  has_content: true
                  type: standards
                - slug: clinerules
                  title: .clinerules
                  summary: Configuration file for Cline AI coding assistant providing project-specific rules, coding conventions, and behavioral instructions.
                  url: https://standards.apievangelist.com/store/clinerules/
                  tags:
                  - AI Agents
                  - Cline
                  - Developer Workflow
                  - Coding Standards
                  - AI Copilot
                  has_content: true
                  type: standards
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Window:
              $ref: '#/components/headers/XRateLimitWindow'
            X-RateLimit-Tier:
              $ref: '#/components/headers/XRateLimitTier'
