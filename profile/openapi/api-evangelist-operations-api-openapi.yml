                  page: 1
                  limit: 2
                  pages: 15
                  query:
                    tags: null
                data:
                - slug: analytics
                  title: Analytics
                  summary: Analytics turns raw API activity into understanding. Who is using what, how often, and to what end tells me where the value is and where the friction lives. I use analytics to make product decisions instead of guessing at them.
                  url: https://lifecycle.apievangelist.com/store/analytics/
                  tags:
                  - Analytics
                  - Observability
                  - Business
                  has_content: false
                  type: lifecycle
                - slug: authentication
                  title: Authentication
                  summary: Authentication is where access begins. Keys, OAuth, JWT, and mTLS each make sense in different contexts, and I pick the approach that fits the consumer and the risk. Getting authentication right is what makes an API both usable and defensible at the same time.
                  url: https://lifecycle.apievangelist.com/store/authentication/
                  tags:
