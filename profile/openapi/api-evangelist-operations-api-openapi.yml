openapi: 3.2.0
info:
  title: Evangelist Network Operations API
  version: 1.2.0
  summary: Sixteen years of API research as one API.
  description: 'The API Evangelist network — 5,000+ stories, 77 topic areas, 2,400+ governance building

    blocks (guidance, rules, policies, standards, strategies, schema, properties, experiences,

    lifecycle), conversations, videos, white papers, tools, timelines, services, and the API

    vocabulary — served as a single, searchable REST API.'
  contact:
    name: API Evangelist
    email: info@apievangelist.com
    url: https://apievangelist.com
  license:
    name: CC BY-SA 4.0
    url: https://creativecommons.org/licenses/by-sa/4.0/
servers:
- url: https://api.apievangelist.com/v1
security:
- {}
- ApiKeyAuth: []
tags:
- name: Operations
  description: Strategies, experiences, and the stops along the API lifecycle.
paths:
  /strategies:
    get:
      operationId: listStrategies
      tags:
      - Operations
      summary: Strategies
      description: Search or browse the strategies collection (75) — API strategy patterns.
      parameters:
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Tags'
      - $ref: '#/components/parameters/Match'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paged strategies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEnvelope'
              example:
                meta:
                  total: 75
                  page: 1
                  limit: 2
                  pages: 38
                  query:
                    tags: null
                data:
                - slug: api-authentication-is-standardized
                  title: API Authentication Is Standardized
                  summary: All APIs must use standardized authentication mechanisms including OAuth, JWT, and API keys with properly defined scopes, ensuring that security is consistently implemented and that consumers have a predictable experience when authenticating across all APIs.
                  url: https://strategies.apievangelist.com/store/api-authentication-is-standardized/
                  tags: []
                  has_content: false
                  type: strategies
                - slug: api-authorization-is-properly-defined-and-enforced
                  title: API Authorization Is Properly Defined and Enforced
                  summary: All APIs must have clearly defined authorization models that control what authenticated consumers can access and perform, using role-based or attribute-based access control to ensure that permissions are granular, auditable, and consistently enforced across all API operations.
                  url: https://strategies.apievangelist.com/store/api-authorization-is-properly-defined-and-enforced/
                  tags: []
                  has_content: false
                  type: strategies
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Window:
              $ref: '#/components/headers/XRateLimitWindow'
            X-RateLimit-Tier:
              $ref: '#/components/headers/XRateLimitTier'
  /strategies/{slug}:
    get:
      operationId: getStrategiesItem
      tags:
      - Operations
      summary: Strategy
      description: One entry from the strategies collection; `include=content` adds the full body.
      parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doc'
              example:
                slug: api-authentication-is-standardized
                title: API Authentication Is Standardized
                summary: All APIs must use standardized authentication mechanisms including OAuth, JWT, and API keys with properly defined scopes, ensuring that security is consistently implemented and that consumers have a predictable experience when authenticating across all APIs.
                url: https://strategies.apievangelist.com/store/api-authentication-is-standardized/
                tags: []
                has_content: false
                type: strategies
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Window:
              $ref: '#/components/headers/XRateLimitWindow'
            X-RateLimit-Tier:
              $ref: '#/components/headers/XRateLimitTier'
        '404':
          $ref: '#/components/responses/NotFound'
  /experiences:
    get:
      operationId: listExperiences
      tags:
      - Operations
      summary: Experiences
      description: Search or browse the experiences collection (46) — API producer and consumer experience patterns.
      parameters:
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Tags'
      - $ref: '#/components/parameters/Match'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paged experiences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEnvelope'
              example:
                meta:
                  total: 46
                  page: 1
                  limit: 2
                  pages: 23
                  query:
                    tags: null
                data:
                - slug: access
                  title: Access
                  summary: 'Gaining the necessary access to effectively use an API is often more challenging than it appears. Intentional and unintentional barriers can create friction in discovering and onboarding with an API. Issues such as incomplete documentation and complex authentication processes frequently hinder adoption. These challenges often reflect the business dynamics and internal politics of making APIs available to teams, partners, and third-party developers.

                    While API access may seem straightforward to the developers who created it—or to those accustomed to high-friction onboarding—it often overlooks critical steps that could simplify the process for others. Improving the API access experience can be as simple as providing clearer instructions, maintaining regular communication, and adopting the perspective of an API consumer. By walking through your own APIs or evaluating competitors’ offerings, you can identify opportunities to streamline access and improve usability.'
                  url: https://experiences.apievangelist.com/store/access/
                  tags:
                  - Availability
                  - Discovery
                  has_content: false
                  type: experiences
                - slug: advocacy
                  title: Advocacy
                  summary: 'Advocacy is the experience of an API having someone in its corner, speaking up for its consumers and carrying their needs back into the operation. Developer relations, evangelism, and outreach are how a provider shows it cares about the people building on its API rather than just shipping endpoints and walking away. Good advocacy turns an API from a product into a relationship.

                    I have spent my whole career on the advocacy side of APIs, so I know how much it matters when someone inside an operation is genuinely fighting for consumers. Advocacy means writing the content, running the outreach, and closing the loop between what developers struggle with and what the team builds next. The APIs that invest in advocacy are the ones that build durable, loyal communities.'
                  url: https://experiences.apievangelist.com/store/advocacy/
                  tags:
                  - Evangelism
                  - Communication
                  - Community
                  has_content: false
                  type: experiences
          headers:
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Window:
              $ref: '#/components/headers/XRateLimitWindow'
            X-RateLimit-Tier:
              $ref: '#/components/headers/XRateLimitTier'
