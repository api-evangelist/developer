      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Tags'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Recorded conversations with guest and media metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEnvelope'
              example:
                meta:
                  total: 59
                  page: 1
                  limit: 2
                  pages: 30
                  query:
                    tags: null
                data:
                - slug: 2026-08-18-sebastian-loch
                  title: API Evangelist Conversation with Sebastian Loch on Verified Nutrition Data, Building Image Recognition on Top of LLMs, and a 100x Influx of Vibe-Coding Developers
                  summary: Sebastian Loch on how a twenty-year-old verified nutrition database survived the AI rush, why LLMs are welcome everywhere except in the data itself, and what a 100x wave of vibe-coding developers does to a bootstrapped API business.
                  url: https://conversations.apievangelist.com/store/2026-08-18-sebastian-loch.html
                  tags:
                  - Nutrition
                  - Artificial Intelligence
                  - Data
                  - Vibe Coding
                  - Health
                  date: '2026-08-18 15:00:00'
                  guest: Sebastian Loch
                  guest_role: Head of Business Development
                  guest_company: fatsecret
                  youtube_id: -ym0WKjZwZ8
                  soundcloud: https://soundcloud.com/kinlane/api-evangelist-conversation-with-sebastian-loch
                  duration: 0:36:51
                  has_content: false
                  type: conversations
                - slug: 2026-08-13-phil-leggetter
                  title: API Evangelist Conversation with Phil Leggetter on Webhooks, Event Destinations, and Building a Team as a Fleet of Agents
                  summary: Phil Leggetter on why event-driven architecture is often over-built, the Outpost open-source story, and scaling a small team with a fleet of role-based agents.
                  url: https://conversations.apievangelist.com/store/2026-08-13-phil-leggetter.html
                  tags:
                  - Webhooks
                  - Event-Driven Architecture
                  - Developer Relations
                  - Open Source
                  - Artificial Intelligence
                  date: '2026-08-13 15:00:00'
                  guest: Phil Leggetter
                  guest_role: Head of Product-Led Growth and Developer Relations
                  guest_company: Hookdeck
                  youtube_id: gwu5saNLmeY
                  soundcloud: https://soundcloud.com/kinlane/api-evangelist-conversation-with-phil-leggetter
                  duration: 0:28:43
                  has_content: false
                  type: conversations
