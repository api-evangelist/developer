  /papers:
    get:
      operationId: listPapers
      tags:
      - Media
      summary: Papers
      description: API Evangelist white papers — deep dives distilled from sixteen years of research, with outlines.
      parameters:
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Papers with outlines and landing URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEnvelope'
              example:
                meta:
                  total: 21
                  page: 1
                  limit: 2
                  pages: 11
                  query:
                    tags: null
                data:
                - slug: change-on-the-agent-surface
                  title: Change on the Agent Surface
                  summary: Everything the industry knows about API change assumes a consumer who reads. Three layers govern change in MCP, the discipline degrades as it approaches the consumer, and the tool surface an agent actually binds to is governed by nobody — with the evidence from a full walk of the public MCP registry, and eight rules for the layer versioning does not reach.
                  url: https://papers.apievangelist.com/papers/change-on-the-agent-surface/
                  tags: []
                  area: Fundamentals
                  tagline: Governing versioning, breaking changes, and deprecation for the MCP tools an agent binds to.
                  pages: ~16
                  version: '1.0'
                  updated: August 2026
                  outline:
                  - The three layers, and what governs each
                  - What the evidence shows
                  - The description is not documentation, it is input
                  - Which changes actually break an agent
                  - The practice — eight rules for the agent surface
                  - Anti-patterns worth watching for
                  - Provider self-assessment
                  - Where this is going
                  - Appendix A — Evidence and method
                  - Appendix B — Sources and further reading
                  cover: /assets/covers/change-on-the-agent-surface.png
                  type: papers
                - slug: arazzo-api-integration-page
                  title: Delivering a Modern API Integration Page with Arazzo
                  summary: You should not be building integrations anymore — you should be describing them. An integration is two ends and a wire; both ends already publish OpenAPI, and Arazzo is the wire. This paper reframes the integrations page from a gallery of connector apps into a directory of Arazzo workflows anyone can fork and run, walks the anatomy, rebuilds a real marketplace's popular listings as verified workflows, is honest about the hard parts, and shows why owning an integration beats renting a connector — plus a provider self-assessment.
                  url: https://papers.apievangelist.com/papers/arazzo-api-integration-page/
                  tags: []
                  area: Fundamentals
                  tagline: Turn your integrations page from a gallery of connectors into a directory of forkable workflows.
                  pages: ~20
                  version: '1.0'
                  updated: July 2026
                  outline:
                  - The integration was always two ends and a wire
                  - From connectors to described behavior — the sixteen-year trap
                  - What Arazzo is, and what it is not
                  - From a gallery to a directory — the integrations page reimagined
                  - The anatomy of an Arazzo-backed integration
                  - A worked example — rebuilding a marketplace as workflows
                  - The honest hard parts — auth, rate limits, pagination, async, failure
                  - What the marketplace becomes — the economics of described integrations
                  - Anti-patterns worth watching for
                  - Where this is going — MCP is the wire, Arazzo is the conductor
                  - Provider self-assessment
                  cover: /assets/covers/arazzo-api-integration-page.png
                  type: papers
