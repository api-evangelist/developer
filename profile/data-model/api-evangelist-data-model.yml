governance_api:
  note: >-
    The governance API has no persistent entities and declares no components.schemas — every
    operation is stateless compute over a `document` supplied in the request body. The only
    durable object it mints is a governance certificate (POST /governance/certify), re-checkable
    with POST /governance/verify; the certificate shape is not published in the contract.
  gaps:
  - components.schemas is empty in openapi/apievangelist-governance-openapi.json — request and
    response bodies are described in prose, not schema.
  - three operations (GET /auth/login, GET /auth/me, POST /billing/checkout) carry no operationId.

gaps:
- One polymorphic `Doc` with additionalProperties:true means the per-type fields an agent will
  actually receive are not in the contract.
- No id-reference fields between resources; the graph is expressed only through tags and the
  /related operations, so relationships are query-time, not schema-time.
