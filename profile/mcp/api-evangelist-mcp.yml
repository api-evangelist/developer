  input_properties:
  - slug
- name: company_gaps
  description: A company's weakest investment dimensions — where it is thin. Pro.
  input_properties:
  - slug
- name: company_dimensions
  description: 'PRO — a company''s investment dimensions, each read AGAINST the measured cohort: the cohort
    median, mean and max, this company''s rank and percentile, and an index where 1.0 is exactly typical.
    A raw dimension score is unreadable on its own; these are the columns that make it mean something.'
- name: company_peers
  description: PRO — the companies most comparable to this one (same sub-sector where the data supports
    it, same industry otherwise), each with signal totals and top dimensions. The response says which
    basis it used.
- name: company_whitespace
  description: PRO — what this company's peers run that it does not, ranked by how many peers carry it.
    The opening list for a vendor selling into the account.
- name: company_signals
  description: PRO — the company's adopted stack entity by entity (services, tools, standards), each with
    how many companies across the cohort carry it and its radar ring.
- name: find_entities
  description: 'Browse the demand-side entity catalog — every service, tool and standard companies are
    measured against, ranked by how many carry it. Free. This is the left-hand side of the inversion:
    pick an entity here, then call entity_demand to see WHO.'
- name: entity_demand
  description: 'PRO — THE INVERSION. Every other insights tool runs company -> stack; this one runs stack
    -> companies: which companies show demand for a given service, tool or standard, broken down by industry.
    This is the prospecting query — "who should I be selling this to" — and it exists in no report, bundle
    or page. Returns BOTH the authoritative company count and the companies it can actually name, with
    the basis difference explained.'
- name: find_measured_standards
  description: The standards bodies API Evangelist has actually MEASURED — repositories, maturity, governance,
    coalition. Distinct from find_standards, which searches 613 catalog entries describing what a standard
    IS. Free.
- name: standard_adoption
  description: 'How far a standards body actually got: repositories published, how many graduated past
    unclassified and the resulting share, release cadence, contributor count — with the provenance of
    every figure and an explicit list of what is NOT measured. Free, because a specification is a public
    good.'
- name: standard_coalition
  description: 'Who is actually behind a standard: the governing bodies and their membership, the working
    groups, the member companies, and the named people. Carries the caveats where our machine-readable
    source disagrees with the body''s own published roster. Free.'
- name: standard_repositories
  description: Every repository a standards body publishes, with maturity, stars, forks, open issues and
    archived status. Free.
- name: validate_api
  description: Lint an OpenAPI, AsyncAPI, Arazzo, or JSON Schema document against the curated best-of-breed
    ruleset (Spectral) and return the findings. Pass your own `ruleset` to run rules you own instead of
    the catalog — which is what you should do before gating on anything.
- name: api_coverage
  description: Measure how much of an API description your governance actually inspects — coverage by
    section, each rule's reach, and the rules that match nothing. Like test coverage, one altitude up.
- name: reconcile_waivers
  description: 'Reconcile a waivers file against lint output: suppress sanctioned violations and surface
    the expired, stale, and expiring ones. Returns the effective failing set a build should gate on.'
- name: governance_report
  description: Turn Spectral findings into a self-contained HTML governance report — severity summary,
    grouped by rule, framed toward progress.
- name: verify_certificate
  description: Re-verify a governance certificate against the API it attests to. If the API drifted or
    the certificate was forged, verification fails.
- name: classify_api_fields
  description: Inventory the PII, secret, and sensitive fields an OpenAPI exposes, across parameters and
    request/response schemas. Run this before exposing an API to agents.
- name: diff_api_versions
  description: Compare two OpenAPI versions and classify every change as breaking, non-breaking, or an
    addition — at path, operation, parameter, request-body, and response granularity.
- name: api_scorecard
  description: Score an API's maturity 0-100 with a letter grade across design, governance coverage, documentation,
    and (from an apis.json) discoverability, agent-readiness, and operations. Pass your own `ruleset`
    — a score against rules you never adopted means little.
- name: govern_estate
  description: 'PRO — Run the core governance checks across a WHOLE SET of internal APIs and roll them
    up: per-API score/grade/errors/PII, plus estate aggregates (avg score, grade distribution, APIs with
    PII/secrets) and a worst-first punch-list of what to fix. Pass `apis` ([{id, document}]) and your
    own `ruleset`. detail:true adds per-API dimensions.'
  tier: pro
- name: deprecation_posture
  description: Report every deprecated operation and whether it actually announces a sunset. The ones
    that go quiet are the ones that break consumers.
- name: validate_onboarding
  description: Validate an API Onboarding Descriptor (AID) against the api-commons schema and report which
    optional sections it fills in.
- name: certify_api
  description: Issue a tamper-evident governance certificate attesting an API passed a named ruleset at
    a profile threshold. A SHA-256 fingerprint lets anyone re-verify it.
- name: export_agent_rules
  description: Turn a governance ruleset into agent-native guidance — an AGENTS.md block, a system-prompt
    set, a per-rule remediation pack, and a digest — so agents follow the rules while authoring, not after
    linting.
- name: audit_pipeline
  description: Score a repository's Spectral CI setup against an 8-point maturity rubric and return a
    prioritized punch-list. Pass a public `repo` ("owner/name") or `files`.
- name: forge_mcp_tools
  description: From an OpenAPI, forge an MCP server design, per-operation tools, Agent Skills, an enriched
    OpenAPI, a server.json, and apis.json properties.
- name: gate_agent_context
  description: Choose which operations and fields an API exposes to agents and emit a governed Tyk OpenAPI,
    an MCP tool manifest, and a Spectral ruleset with PII and secret checks.
- name: apply_overlay
  description: Apply an OpenAPI Overlay to a document and report what each action matched. Use it for
    deprecation and migration choreography without forking the contract.
- name: mock_payloads
  description: Generate an example request and success-response payload for every operation from its schema.
- name: code_snippets
  description: Generate runnable curl, JavaScript, and Python samples for every operation, with path params
    filled in and a realistic body.
- name: score_reusability
  description: Score how reusable a set of APIs is and detect duplication across them — the anti-sprawl
    view of an estate.
- name: map_api_experience
  description: Map each REST operation to its MCP tool and Agent Skill — the API -> MCP -> Agent-Skill
    chain — from an APIs.json, with a free/paid coverage scorecard and a flow map.
- name: generate_agent_descriptor
  description: Generate an API's llms.txt and an AGENTS.md consumption contract — base URL, auth, the
    operation table, deprecated operations to avoid, and usage rules.
- name: submit_api_evangelist_feedback
  description: 'Report something wrong with a result: wrong data, a filter that did not filter, a ranking
    that put off-topic results first, a number you could not reproduce, or an answer that was useless
    for your task. Free, and the fastest way to get a defect fixed — the support sweep reads the log this
    lands in. Say what you expected as well as what you got.'
