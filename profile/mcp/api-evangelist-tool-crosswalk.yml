notes:
- The v1 spec publishes x-apis-io.operations — a first-party operationId -> mcpTool -> agentSkill map. Every "high"
  confidence row for the network API comes from that map, not from name matching.
- The Insights operations (getInsightsSummary, listInsightDimensions, listInsightAdoption, listInsightIndustries,
  listInsightCompanies, getCompanyInsight, getCompanyGaps) are live in the spec and five of them have MCP tools,
  but they are missing from x-apis-io.operations — the published experience map is behind the spec.
- Three governance operations (GET /auth/login, GET /auth/me, POST /billing/checkout) carry no operationId in the
  spec, so they cannot be referenced by a tool binding.
